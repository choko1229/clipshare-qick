name: Release

# v* タグで MSIX を作り、下書き（draft）の GitHub Release に添付する。公開は人が確認してから行う。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: ツールチェーン
        run: rustup show active-toolchain || rustup toolchain install
      - name: テスト
        run: cargo test --workspace --locked
      - name: バージョン
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "タグは vX.Y.Z 形式にしてください" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: 署名用の証明書を復元
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) { throw "Secrets に MSIX_PFX_BASE64 がありません" }
          $path = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          "PFX_PATH=$path" >> $env:GITHUB_ENV
      - name: 公開証明書（.cer）を書き出す（セットアップに埋め込む。公開鍵のみ）
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $pfx = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($env:PFX_PATH, $env:PFX_PASSWORD)
          $publisher = (Get-Content installer/signing.json -Raw | ConvertFrom-Json).publisher
          if ($pfx.Subject -ne $publisher) { throw "証明書の Subject が installer/signing.json の publisher と一致しません" }
          $cer = Join-Path $env:RUNNER_TEMP "ClipshareQuick.cer"
          [IO.File]::WriteAllBytes($cer, $pfx.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          "CQ_SIGNING_CER=$cer" >> $env:GITHUB_ENV
      - name: ビルド（証明書を埋め込む）
        run: cargo build --workspace --release --locked
      - name: MSIX を作成・署名
        shell: pwsh
        env:
          CQ_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: ./installer/build-msix.ps1 -Version ${{ steps.ver.outputs.version }} -PfxPath $env:PFX_PATH
      - name: 証明書を削除
        if: always()
        shell: pwsh
        run: if ($env:PFX_PATH -and (Test-Path $env:PFX_PATH)) { Remove-Item -Force $env:PFX_PATH }
      - name: 下書きの Release を作成
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          gh release create "v$v" --draft --title "Clipshare Quick $v" --notes "CHANGELOG.md を参照" `
            "dist/ClipshareQuick-$v.msix" "dist/ClipshareQuick-Setup-$v.exe"
