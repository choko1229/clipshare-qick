name: Release

# v* タグで MSIX とセットアップ exe を作り、SHA256SUMS とともに下書き（draft）の GitHub Release に添付する。
# 添付した実ファイルを下書きから取り直して SHA256SUMS・GitHub の digest と照合し、1 つでも合わなければ
# 失敗させて下書きを削除する（公開できる状態を残さない）。公開は人が確認してから行う。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: ツールチェーン
        run: rustup show active-toolchain || rustup toolchain install
      - name: テスト
        run: cargo test --workspace --locked
      - name: SHA256SUMS のスクリプトのテスト
        shell: pwsh
        run: ./installer/test-release-checksums.ps1
      - name: バージョン
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "タグは vX.Y.Z 形式にしてください" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: 同じタグの Release が無いことを確認
        id: precheck
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $rels = @(gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[] | {id, tag_name, draft}' | ForEach-Object { $_ | ConvertFrom-Json })
          if ($LASTEXITCODE -ne 0) { throw "Release の一覧を取得できませんでした" }
          $same = @($rels | Where-Object { $_.tag_name -ceq $tag })
          if ($same.Count -gt 0) { throw "$tag の Release（下書きを含む）が既にあります。確認して削除してから再実行してください" }
      - name: 署名用の証明書を復元
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) { throw "Secrets に MSIX_PFX_BASE64 がありません" }
          $path = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:PFX_BASE64))
          "PFX_PATH=$path" >> $env:GITHUB_ENV
      - name: 公開証明書（.cer）を書き出す（セットアップに埋め込む。公開鍵のみ）
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $pfx = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($env:PFX_PATH, $env:PFX_PASSWORD)
          $publisher = (Get-Content installer/signing.json -Raw -Encoding UTF8 | ConvertFrom-Json).publisher
          if ($pfx.Subject -cne $publisher) { throw "証明書の Subject（$($pfx.Subject)）が installer/signing.json の publisher（$publisher）と一致しません" }
          $cer = Join-Path $env:RUNNER_TEMP "ClipshareQuick.cer"
          [IO.File]::WriteAllBytes($cer, $pfx.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          "CQ_SIGNING_CER=$cer" >> $env:GITHUB_ENV
      - name: ビルド（証明書を埋め込む）
        run: cargo build --workspace --release --locked
      - name: MSIX を作成・署名
        shell: pwsh
        env:
          CQ_PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: ./installer/build-msix.ps1 -Version ${{ steps.ver.outputs.version }} -PfxPath $env:PFX_PATH
      - name: 証明書を削除
        if: always()
        shell: pwsh
        run: if ($env:PFX_PATH -and (Test-Path $env:PFX_PATH)) { Remove-Item -Force $env:PFX_PATH }
      - name: SHA256SUMS を作成（セットアップ exe と MSIX のみ）
        shell: pwsh
        run: ./installer/release-checksums.ps1 -Mode Write -Dir dist -Version ${{ steps.ver.outputs.version }}
      - name: 下書きの Release を作成
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          gh release create "v$v" --draft --verify-tag --title "Clipshare Quick $v" --notes "CHANGELOG.md を参照" `
            "dist/ClipshareQuick-Setup-$v.exe" "dist/ClipshareQuick-$v.msix" "dist/SHA256SUMS"
          if ($LASTEXITCODE -ne 0) { throw "下書きの Release を作成できませんでした" }
      - name: 添付した実ファイルを SHA256SUMS・digest と照合
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "v$v"
          $repo = $env:GITHUB_REPOSITORY
          $ProgressPreference = "SilentlyContinue"
          $drafts = @(gh api "repos/$repo/releases" --paginate --jq '.[] | {id, tag_name, draft}' | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.tag_name -ceq $tag -and $_.draft })
          if ($drafts.Count -ne 1) { throw "$tag の下書きが 1 件ではありません: $($drafts.Count)" }
          $assets = @(gh api "repos/$repo/releases/$($drafts[0].id)" --jq '.assets[] | {id, name, state, digest}' | ForEach-Object { $_ | ConvertFrom-Json })
          if ($LASTEXITCODE -ne 0) { throw "添付ファイルの一覧を取得できませんでした" }
          $dir = Join-Path $env:RUNNER_TEMP "verify-$v"
          if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
          New-Item -ItemType Directory $dir | Out-Null
          $digests = [ordered]@{}
          foreach ($a in $assets) {
            if ($a.state -cne "uploaded") { throw "アップロードが完了していない添付ファイルがあります: $($a.name)" }
            if ($a.name -notmatch '^[A-Za-z0-9._-]+$') { throw "想定外の添付ファイル名です: $($a.name)" }
            # 添付ファイルの API（認証つき。リダイレクト先には Authorization を送らない）から取り直す
            Invoke-WebRequest -Uri "https://api.github.com/repos/$repo/releases/assets/$($a.id)" `
              -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/octet-stream" } `
              -OutFile (Join-Path $dir $a.name)
            $digests[$a.name] = $a.digest
          }
          # 余分・欠落・不一致・digest の欠落があれば失敗する（release-checksums.ps1）
          ./installer/release-checksums.ps1 -Mode Verify -Dir $dir -Version $v -DigestsJson ($digests | ConvertTo-Json -Compress)
          # ビルドした SHA256SUMS と添付した SHA256SUMS がバイト単位で同じこと
          $local = (Get-FileHash dist/SHA256SUMS -Algorithm SHA256).Hash
          $remote = (Get-FileHash (Join-Path $dir "SHA256SUMS") -Algorithm SHA256).Hash
          if ($local -cne $remote) { throw "添付した SHA256SUMS がビルドしたものと一致しません" }
          Get-Content dist/SHA256SUMS
      - name: 失敗・中止したら下書きを削除（公開できる状態を残さない）
        if: (failure() || cancelled()) && steps.precheck.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # precheck で同じタグの Release が無かったことを確認済みなので、ここで見つかる下書きはこの実行で作ったもの。
          # 公開済み（draft=false）の Release は対象にしない。
          $tag = "v${{ steps.ver.outputs.version }}"
          $drafts = @(gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[] | {id, tag_name, draft}' | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.tag_name -ceq $tag -and $_.draft })
          foreach ($d in $drafts) {
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($d.id)" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "下書き（id $($d.id)）を削除できませんでした。手動で削除してください" }
            Write-Host "下書き（id $($d.id)）を削除しました"
          }
