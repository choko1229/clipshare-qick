[package]
name = "cq-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
cq-ipc = { version = "0.1.0", path = "../ipc" }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
notify = "8.2.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "multipart", "stream"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
zeroize = "1.9.2"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_System_IO", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Memory", "Win32_System_SystemInformation"] }

[lints]
workspace = true
