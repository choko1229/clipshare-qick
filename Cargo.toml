[workspace]
resolver = "3"
members = ["crates/core", "crates/mock-server", "crates/app", "crates/shell-ext", "crates/vr", "crates/ipc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/choko1229/clipshare-qick"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# 依存クレート（画像処理など）はデバッグ/テストでも最適化する（テストの所要時間と安定性のため）。
[profile.dev.package."*"]
opt-level = 2
